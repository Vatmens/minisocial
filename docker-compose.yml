services:
  api:
    build: .
    container_name: social_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db_postgres:
        condition: service_healthy
      db_mongo:
        condition: service_started
    volumes:
      - .:/app

  db_postgres:
    image: postgres:18
    container_name: minisocial_db
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=minisocial
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d minisocial" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/

  db_mongo:
    image: mongo:6
    container_name: minisocial_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data: