version: '3.8'

services:
  api:
    build: .
    container_name: social_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - mongo

  db:
    image: postgres:18
    container_name: minisocial_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=minisocial
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  mongo:
    image: mongo:6
    container_name: minisocial_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
volumes:
  postgres_data:
  mongo_data: